<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0c5e7e">
  <meta name="description" content="Convert Patapon saves between PSP and Patapon 1+2 Replay.">
  <title>Patapon Save Converter</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet">
</head>
<body>
  <main class="stage">
    <img class="scene" id="scene" alt="" aria-hidden="true">
    <section class="ui" aria-label="Patapon Save Converter">
      <h1 class="visually-hidden">Patapon Save Converter</h1>
      <img class="brand" id="brand" alt="Patapon">
      <div class="card" id="card"></div>
      <div class="actions" id="actions"></div>
      <details class="save-path-box" id="save-path">
        <summary class="save-path-toggle">Where's my Replay save?</summary>
        <div class="save-path">
          <span class="save-path-label">Replay saves on PC</span>
          <code class="save-path-text" id="save-path-text">%LOCALAPPDATA%\<wbr>BANDAI NAMCO Entertainment\<wbr>PATAPON 1+2 REPLAY\<wbr>Saved\<wbr>SaveGames</code>
          <button class="save-path-copy" id="save-path-copy" type="button">Copy</button>
        </div>
      </details>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </section>
    <button class="music" id="music" type="button" aria-label="Play music" aria-pressed="false">
      <svg class="music-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      <svg class="music-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
  </main>
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-logos">
        <img class="esrb" id="esrb" alt="ESRB rating: Everyone. Comic Mischief, Mild Fantasy Violence, Mild Language">
        <img class="psp-logo" id="psp-logo" alt="PlayStation Portable">
        <img class="ps-logo" id="ps-logo" alt="PlayStation">
        <img class="bandai" id="bandai" alt="Bandai Namco">
        <img class="japan-studio" id="japan-studio" alt="Japan Studio">
        <img class="pyramid" id="pyramid" alt="Pyramid">
      </div>
      <div class="footer-info">
        <a class="github-link" href="https://github.com/tonykastaneda/PataponSaveConverter" target="_blank" rel="noopener noreferrer" aria-label="Patapon Save Converter on GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.2.8-.5v-2.2c-3.3.7-4-1.4-4-1.4-.5-1.4-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.6-.3-5.4-1.3-5.4-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0C15.6 4 16.6 4.3 16.6 4.3c.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.4 5.7.4.4.8 1.1.8 2.2v4.2c0 .3.2.6.8.5A11.5 11.5 0 0 0 12 .7Z"/></svg>
          GitHub
        </a>
        <p class="warning">Please back up your save manually before using</p>
      </div>
    </div>
  </footer>
  <input id="file-input" type="file" accept=".sav,.zip,.bin" hidden>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
